name: muse_desktop_companion
description: "Muse Desktop Companion - a desktop dashboard for your Muse: pixel avatar, chat, and link status."
publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  # Gadget protocol crypto: X25519, AES-GCM, SHA-256/HMAC/HKDF, ECDH P-256.
  cryptography: ^2.7.0
  # REST calls (device API) and character-image downloads.
  http: ^1.3.0
  # Encrypted on-device storage for SDK/device tokens and identity.
  flutter_secure_storage: ^9.2.2
  # Plain settings (theme, display prefs, non-secret state).
  shared_preferences: ^2.3.3
  # Image/character cache directory.
  path_provider: ^2.1.5
  # Real battery level/charging state for device.health.
  battery_plus: ^6.2.3
  # Real device model / OS version for device.health.
  device_info_plus: ^12.4.0
  # Markdown rendering in chat bubbles.
  flutter_markdown: ^0.7.7
  # Window size, minimum size, and bounds persistence.
  window_manager: ^0.5.1
  # Microphone capture for push-to-talk voice notes.
  record: ^5.0.0
  # Text-to-speech for spoken assistant replies.
  flutter_tts: ^4.0.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# record_linux 0.7.2 (pulled by record 5.x) only implements
# record_platform_interface 1.2.0: later 1.x versions added abstract
# members (startStream) and changed hasPermission's signature, which
# breaks compilation since Flutter registers every federated Dart
# plugin implementation on all platforms. Revisit when record 7+
# (needs Flutter 3.44+) is adopted.
dependency_overrides:
  record_platform_interface: 1.2.0

flutter:
  uses-material-design: true
